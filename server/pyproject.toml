[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payreality-server"
version = "0.1.0"
description = "PayReality decision engine, policy pipeline, and evidence vault"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pynacl>=1.5",
    "anthropic>=0.39",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
    "bcrypt>=4.2",
    # Opt-in only -- see app/observability.py's docstring. Inert (never
    # imported past the `if not settings.applicationinsights_connection_string`
    # guard) on Render, which never sets that variable.
    "azure-monitor-opentelemetry>=1.6",
    # Authority Intelligence Program, Phase 1 -- see
    # app/services/authority_intelligence_service.py's docstring. All
    # three are opt-in the same way: imported only inside functions that
    # already checked their own settings field first, so they're
    # installed but never touched on Render or any environment that
    # hasn't had modules/ai-foundry / modules/ai-search applied yet.
    "azure-ai-inference>=1.0.0b9",
    "azure-search-documents>=11.5",
    "azure-storage-blob>=12.23",
    "azure-identity>=1.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
