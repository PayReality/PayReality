[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payreality"
version = "0.2.0"
description = "Official Python SDK for PayReality: authorize an AI agent's action in one call, no manual signing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "requests>=2.31",
    "PyNaCl>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["payreality*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
