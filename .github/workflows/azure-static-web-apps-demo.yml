# Migrates the public demo off Vercel (payreality-demo-public,
# demo.aisecurewatch.com) onto Azure Static Web Apps, mirroring
# azure-static-web-apps.yml's own pattern exactly (Milestone 16: Vercel
# -> Azure Frontend Migration did this for the dashboard and marketing
# site; the demo was explicitly out of scope there and stayed on Vercel
# until now). This is the SAME repository and SAME codebase as the
# dashboard workflow -- the only difference is which build-time env var
# gets baked in: VITE_PUBLIC_DEMO_MODE=true here instead of a real
# VITE_API_URL, since the demo never calls the real backend (it runs
# entirely against src/app/demo/mockRouter.ts's mock API layer).
name: Deploy demo to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - name: Build
        env:
          VITE_PUBLIC_DEMO_MODE: "true"
          VITE_MIXPANEL_TOKEN: ${{ secrets.VITE_MIXPANEL_TOKEN }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEMO }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
