name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Same pinned version as server/Dockerfile, so a real opa binary is
      # on PATH for tests/integration/ (compiler_v2's OPA integration
      # suite): without this they'd silently skip in CI instead of
      # actually running, see tests/integration/conftest.py.
      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/v1.7.1/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
      - run: pytest -q

  server-image:
    runs-on: ubuntu-latest
    needs: server-tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t payreality-server:ci ./server

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  sdk-tests:
    # Integration Kit v1: the SDK had zero CI coverage before this job --
    # confirmed by inspection, not assumed. Package install + test run
    # only; no publish step, since no PyPI/private registry exists yet
    # (see INTEGRATION_KIT.md's Installation section).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q
